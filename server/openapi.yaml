openapi: 3.0.3
info:
  title: GeTaTaPi API
  version: 1.0.0
  description: |
    REST API for the GeTaTaPi Android application.
    Authentication is performed using Supabase Auth JWT.
    All timestamps are returned in ISO 8601 UTC format.
servers:
  - url: https://{project-ref}.supabase.co/functions/v1/api-v1
    description: Supabase Edge Functions
    variables:
      project-ref:
        default: your-project-ref

security:
  - bearerAuth: []

tags:
  - name: Topics
  - name: Tasks
  - name: Submissions
  - name: Statistics

paths:
  /topics:
    get:
      tags: [Topics]
      summary: Get available topics
      operationId: getTopics
      responses:
        '200':
          description: Topics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Topic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    post:
      tags: [Tasks]
      summary: Create a photo challenge task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topicId, difficulty]
              properties:
                topicId:
                  type: string
                  format: uuid
                difficulty:
                  $ref: '#/components/schemas/Difficulty'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task details
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /submissions:
    post:
      tags: [Submissions]
      summary: Create a submission for asynchronous AI verification
      operationId: createSubmission
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Unique key used to prevent duplicate submissions on retries.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, storagePath]
              properties:
                taskId:
                  type: string
                  format: uuid
                storagePath:
                  type: string
                  description: Path of the uploaded image in the private submissions bucket.
                  example: 2f1c.../8a4d.../original.jpg
      responses:
        '202':
          description: Submission accepted and queued for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/AiProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags: [Submissions]
      summary: Get the user's submission history
      operationId: getSubmissions
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Cursor returned in the previous page response.
      responses:
        '200':
          description: Submission history
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Submission'
                  page:
                    type: object
                    required: [limit, nextCursor]
                    properties:
                      limit:
                        type: integer
                      nextCursor:
                        type: string
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /submissions/{submissionId}:
    get:
      tags: [Submissions]
      summary: Get submission status and verification result
      operationId: getSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Submission status and result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /statistics:
    get:
      tags: [Statistics]
      summary: Get the user's statistics
      operationId: getStatistics
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.

  parameters:
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Difficulty:
      type: string
      enum: [easy, medium, hard]

    Topic:
      type: object
      required: [id, code, title, isActive, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    Task:
      type: object
      required: [id, topicId, difficulty, prompt, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        topicId:
          type: string
          format: uuid
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        prompt:
          type: string
        status:
          type: string
          description: Current task status.
          example: active
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    SubmissionAccepted:
      type: object
      required: [id, taskId, status, createdAt, statusUrl]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        createdAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          description: Relative URL for checking the submission status.

    Submission:
      type: object
      required: [id, taskId, status, passed, feedback, confidence, createdAt, checkedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
        passed:
          type: boolean
          nullable: true
        feedback:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        createdAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
          nullable: true

    Statistics:
      type: object
      required: [completedCount, passedCount, currentStreak, bestStreak, lastActivityDate, byDifficulty, byTopic]
      properties:
        completedCount:
          type: integer
          minimum: 0
        passedCount:
          type: integer
          minimum: 0
        currentStreak:
          type: integer
          minimum: 0
        bestStreak:
          type: integer
          minimum: 0
        lastActivityDate:
          type: string
          format: date
          nullable: true
        byDifficulty:
          type: object
          properties:
            easy:
              type: integer
              minimum: 0
            medium:
              type: integer
              minimum: 0
            hard:
              type: integer
              minimum: 0
        byTopic:
          type: array
          items:
            type: object
            required: [topicId, title, completedCount]
            properties:
              topicId:
                type: string
                format: uuid
              title:
                type: string
              completedCount:
                type: integer
                minimum: 0

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string
            requestId:
              type: string
              format: uuid

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user is not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current resource state or idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Uploaded file exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Unsupported media type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AiProviderError:
      description: AI verification provider returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
